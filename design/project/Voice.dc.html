<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice — hands-free guidance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Montserrat:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#050506}
a{color:#9DB6FF}a:hover{color:#C6D5FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 14px; background: #050506; color: #EDEDEF; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.45; overflow: hidden">

  <section aria-label="Next step" style="background: #16171A; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 16px">
      <span style="width: 64px; height: 64px; flex: none; border-radius: 18px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-7a4 4 0 0 0-4-4H6"></path><path d="M10 6l-4 4 4 4"></path></svg>
      </span>
      <div style="display: flex; flex-direction: column; min-width: 0">
        <span style="font-family: Montserrat, sans-serif; font-size: 34px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums">14 m</span>
        <span style="color: #A3A5AC">along the main aisle</span>
      </div>
    </div>
    <span style="font-family: Montserrat, sans-serif; font-size: 22px; font-weight: 500; line-height: 1.25">Turn left at the conveyor</span>
    <div style="display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid #26282D; color: #A3A5AC; font-size: 14px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4l8 8-8 8"></path></svg>
      Then Production zone H-A4, on your right
    </div>
  </section>

  <div style="position: relative; flex: 1; min-height: 0; border-radius: 22px; overflow: hidden; background: #0B0C0E">
    <svg viewBox="0 0 358 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Heading-up map: you are in the main aisle, the conveyor is ahead on the left, Production zone H-A4 is beyond it on the right" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%">
      <g font-family="Inter, sans-serif" font-size="11" fill="#8B8D94">
        <rect x="0" y="0" width="140" height="300" fill="#15161A"></rect>
        <rect x="218" y="0" width="140" height="300" fill="#15161A"></rect>
        <rect x="140" y="0" width="78" height="300" fill="#1D1F24"></rect>
        <path d="M140 0v300M218 0v300" stroke="#2B2D33" stroke-width="1.5"></path>
        <rect x="40" y="96" width="70" height="12" rx="2" fill="#3A3C42"></rect>
        <text x="40" y="88" fill="#C9CACF" font-weight="600">Conveyor</text>
        <text x="14" y="22">Assembly zone H-A2</text>
        <text x="232" y="22">Production zone H-A4</text>
        <rect x="244" y="60" width="44" height="28" rx="2" fill="#24262B"></rect>
        <rect x="244" y="112" width="40" height="50" rx="2" fill="#24262B"></rect>
        <text x="296" y="141" fill="#EDEDEF" font-weight="600">Waterjet</text>
        <polyline points="179,270 179,104 120,104" fill="none" stroke="{{accent}}" stroke-opacity="0.22" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"></polyline>
        <polyline points="179,270 179,104 120,104" fill="none" stroke="{{accent}}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></polyline>
        <circle cx="179" cy="236" r="20" fill="{{accent}}" fill-opacity="0.18"></circle>
        <path d="M179 222l11 24-11-6-11 6z" fill="#EDEDEF"></path>
      </g>
    </svg>
    <div style="position: absolute; left: 12px; top: 12px; display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(22, 23, 26, 0.9); font-size: 13px; color: #D6D7DB">Ground floor · Main aisle</div>
  </div>

  <section aria-label="Conversation" style="display: flex; flex-direction: column; gap: 8px">
    <p style="margin: 0; color: #A3A5AC; font-size: 14px">You said</p>
    <p style="margin: 0; font-size: 17px">“Which one is the waterjet cutter?”</p>
    <p style="margin: 0; color: #D6D7DB">It's the tall machine just past the conveyor, in Production zone H-A4. I'll tell you when to turn.</p>
  </section>

  <div style="display: flex; align-items: center; gap: 14px">
    <div style="display: flex; flex-direction: column; min-width: 0">
      <span style="font-family: Montserrat, sans-serif; font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums">52 m</span>
      <span style="color: #A3A5AC; font-size: 14px">about 1 min</span>
    </div>
    <div aria-hidden="true" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; height: 40px">
      <span style="width: 4px; height: 10px; border-radius: 2px; background: #4A4C52"></span>
      <span style="width: 4px; height: 22px; border-radius: 2px; background: {{accent}}"></span>
      <span style="width: 4px; height: 32px; border-radius: 2px; background: {{accent}}"></span>
      <span style="width: 4px; height: 18px; border-radius: 2px; background: {{accent}}"></span>
      <span style="width: 4px; height: 26px; border-radius: 2px; background: {{accent}}"></span>
      <span style="width: 4px; height: 12px; border-radius: 2px; background: #4A4C52"></span>
      <span style="width: 4px; height: 8px; border-radius: 2px; background: #4A4C52"></span>
    </div>
    <button aria-label="Listening. Tap to stop" style="width: 72px; height: 72px; flex: none; border-radius: 36px; border: 0; background: #EDEDEF; color: #111214; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
    </button>
  </div>

  <div style="display: flex; gap: 10px">
    <button style="flex: 1; height: 48px; border-radius: 24px; border: 1px solid #33353B; background: transparent; color: #EDEDEF; font: inherit; font-weight: 500; cursor: pointer">Repeat</button>
    <button style="flex: 1; height: 48px; border-radius: 24px; border: 1px solid #33353B; background: transparent; color: #EDEDEF; font: inherit; font-weight: 500; cursor: pointer">End route</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3E6AE1","options":["#3E6AE1","#2B9C8A","#C9CACF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#3E6AE1' };
}
}
</script>
</body>
</html>
